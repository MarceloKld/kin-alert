version: '3.9'

services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: kin_alert_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - kin_alert_network

  nginx:
    image: nginx:stable-alpine
    container_name: kin_alert_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kin_alert_network

  db:
    image: mysql:8
    container_name: kin_alert_db
    restart: unless-stopped
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    environment:
      MYSQL_DATABASE: kin_alert
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: kin_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - kin_alert_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: kin_alert_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    networks:
      - kin_alert_network

networks:
  kin_alert_network:

volumes:
  dbdata: